// ================= Поле: 684x384 (16:9), клетка 32 =================
const TILE = 32, ROWS = 12, W = 684, H = ROWS * TILE, STEP_MS = 1000 / 60;
const HUD_H = 32, VIEW_H = H + HUD_H;         // полоса счёта над миром: не закрывает верхний ряд потолка
const GRAV = 0.55, MAXFALL = 11, JUMP_V = -11.2, JUMP_CUT = -4, SPRING_V = -15.5;
const WALK = 3, RUN = 4.2, ACC = 0.45, FRICTION = 0.8, COYOTE = 6, JUMP_BUFFER = 6;
const T = { EMPTY: 0, GROUND: 1, BRICK: 2, GIFT: 3, USED: 4, STONE: 5, PILLAR: 6, PILLAR_TOP: 7 };
const params = new URLSearchParams(location.search);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = params.has('seed') ? mulberry32(Number(params.get('seed')) || 1) : Math.random;

// ================= Уровни собираются кодом =================
function makeLevel(width, theme, fill) {
  const L = { w: width, theme, t: new Uint8Array(width * ROWS), coins: [], enemies: [], movers: [], springs: [], spikes: [], checkpoints: [], flagX: 0, flagHit: 0, flagTop: 2 * TILE, boss: null, arena: null, start: { x: 64 } };
  const set = (x, y, v) => { if (x >= 0 && x < width && y >= 0 && y < ROWS) L.t[y * width + x] = v; };
  const api = {
    ground(a, b) { for (let x = a; x <= b; x++) { set(x, 10, T.GROUND); set(x, 11, T.GROUND); } },
    hill(a, b, h) { for (let x = a; x <= b; x++) for (let y = 10 - h; y <= 11; y++) set(x, y, T.GROUND); },
    pit(a, b) { for (let x = a; x <= b; x++) for (let y = 0; y < ROWS; y++) if (L.t[y * width + x] === T.GROUND) set(x, y, T.EMPTY); },
    ceiling(a, b, h = 2) { for (let x = a; x <= b; x++) for (let y = 0; y < h; y++) set(x, y, T.STONE); },
    blocks(x, y, s) { [...s].forEach((ch, i) => { const v = { B: T.BRICK, '?': T.GIFT, S: T.STONE }[ch]; if (v) set(x + i, y, v); }); },
    coins(x, y, n, dx = 1) { for (let i = 0; i < n; i++) L.coins.push({ x: (x + i * dx) * TILE + 8, y: y * TILE + 6, w: 16, h: 20, taken: false }); },
    pillar(x, h, base = 9) { for (let k = 0; k < h; k++) for (const dx of [0, 1]) set(x + dx, base - k, k === h - 1 ? T.PILLAR_TOP : T.PILLAR); },
    stairsUp(x, h) { for (let i = 0; i < h; i++) for (let k = 0; k <= i; k++) set(x + i, 9 - k, T.STONE); },
    stairsDown(x, h) { for (let i = 0; i < h; i++) for (let k = 0; k < h - i; k++) set(x + i, 9 - k, T.STONE); },
    beetle(x, row = 10) { L.enemies.push({ kind: 'beetle', x: x * TILE + 2, y: row * TILE - 24, w: 28, h: 24, vx: -1, vy: 0 }); },
    bee(x, row, range = 3) { L.enemies.push({ kind: 'bee', x: x * TILE, y: row * TILE, base: row * TILE, home: x * TILE, range: range * TILE, w: 26, h: 20, vx: -0.8, vy: 0, fly: true }); },
    mover(x, row, len, axis, range, speed = 0.9) { L.movers.push({ x: x * TILE, y: row * TILE, w: len * TILE, h: 12, axis, range: range * TILE, speed, bx: x * TILE, by: row * TILE, t: 0, dx: 0, dy: 0 }); },
    spring(x, row = 10) { L.springs.push({ x: x * TILE + 4, y: row * TILE - 16, w: 24, h: 16, squash: 0 }); },
    spikes(a, b, row = 10) { L.spikes.push({ x: a * TILE, y: row * TILE - 12, w: (b - a + 1) * TILE, h: 12 }); },
    checkpoint(x) { L.checkpoints.push({ x: x * TILE + 12, reached: false }); },
    flag(x) { L.flagX = x * TILE + 14; L.flagHit = x * TILE - 1; set(x, 9, T.STONE); },
    boss(kind, a, b) { L.boss = kind; L.arena = { a: a * TILE, b: b * TILE }; },
  };
  fill(api);
  return L;
}

const WORLD_NAMES = { 1: 'Мир 1: Солнечная долина', 2: 'Мир 2: Подземелья' };

// ================= Состояние =================
const state = { phase: 'play', mode: 'demo', levelIdx: 0, lives: 3, coins: 0, score: 0, timer: 0, frame: 0, dyingT: 0, clearT: 0, respawn: null, banner: null, shake: 0, hurtInLevel: false, bossHitTaken: false };
const player = { x: 0, y: 0, w: 22, h: 30, vx: 0, vy: 0, onGround: false, facing: 1, coyote: 0, buffer: 0, walk: 0, standOn: null, invuln: 0, boost: false };
let level = null, camX = 0, boss = null, lockCam = null;
const pops = [], particles = [], rocks = [];
let jumpWasDown = false, autopilot = false;
let kit;
let progress = { unlocked: 0, levels: {}, done: false };
let totals = { coins: 0, stomps: 0 };

function tileAt(tx, ty) {
  if (tx < 0) return T.STONE;
  if (tx >= level.w || ty < 0 || ty >= ROWS) return T.EMPTY;
  return level.t[ty * level.w + tx];
}
function setTile(tx, ty, v) { level.t[ty * level.w + tx] = v; }
const solid = (tx, ty) => tileAt(tx, ty) !== T.EMPTY;

// ================= Звуки =================
function seq(notes) { notes.forEach(([f, d], i) => kit.tone(f, d, { vol: 0.08, delay: i * 0.1 })); }
const SFX = {
  jump: () => kit.tone(420, 0.14, { vol: 0.06, slide: 820 }),
  spring: () => kit.tone(300, 0.25, { type: 'triangle', vol: 0.09, slide: 1200 }),
  coin: () => { kit.tone(900, 0.05, { vol: 0.06 }); kit.tone(1350, 0.14, { vol: 0.06, delay: 0.05 }); },
  bump: () => kit.tone(160, 0.08, { vol: 0.1, slide: 90 }),
  stomp: () => kit.tone(260, 0.1, { type: 'triangle', vol: 0.12, slide: 80 }),
  hurt: () => seq([[400, 0.12], [330, 0.12], [220, 0.3]]),
  flag: () => seq([[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.25]]),
  boss: () => { kit.noise(0.5, { vol: 0.25, freq: 500 }); kit.tone(120, 0.5, { type: 'sawtooth', vol: 0.1, slide: 50 }); },
};
function burst(x, y, color, n, sp = 3) {
  if (!kit.settings.effects || particles.length > 300) return;
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (rnd() - 0.5) * sp * 2, vy: -rnd() * sp * 1.6, life: 30 + rnd() * 20, color });
}

// ================= Запуск уровня =================
function livesFor() { return kit.diff({ easy: 5, normal: 3, hard: 2 }); }
function bossHpFor() { return kit.diff({ easy: 2, normal: 3, hard: 4 }); }
function enemySpeed() { return kit.diff({ easy: 0.8, normal: 1, hard: 1.25 }); }

function loadLevel(i) {
  state.levelIdx = i;
  level = LEVELS[i].build();
  for (const e of level.enemies) { e.vx *= enemySpeed(); e.alive = true; e.squash = 0; e.active = false; }
  pops.length = 0; particles.length = 0; rocks.length = 0;
  boss = null; lockCam = null;
  state.respawn = { x: level.start.x };
  placePlayer(state.respawn.x);
}
function placePlayer(x) {
  let top = 10;
  while (top > 0 && solid(Math.floor((x + 11) / TILE), top - 1)) top--;
  Object.assign(player, { x, y: top * TILE - player.h, vx: 0, vy: 0, onGround: true, facing: 1, coyote: 0, buffer: 0, standOn: null, invuln: 60 });
  Object.assign(pilotPlan, { hold: 0, air: false, back: 0, bestX: x, stuck: 0 });
  camX = Math.max(0, Math.min(x - W / 3, level.w * TILE - W));
}
function startLevel(i) {
  autopilot = false;
  state.mode = 'level';
  loadLevel(i);
  state.phase = 'play'; state.lives = livesFor(); state.coins = 0; state.score = 0; state.timer = 0; state.hurtInLevel = false; state.bossHitTaken = false;
  state.banner = { text: `${LEVELS[i].world}-${(i % 4) + 1} ${LEVELS[i].name}`, t: 140 };
  kit.play();
}
function startDemo() {
  state.mode = 'demo';
  loadLevel(0);
  state.phase = 'play'; state.lives = 99; state.timer = 0;
  autopilot = true;
}

// ================= Столкновения с клетками =================
function moveAxis(o, axis) {
  if (axis === 'x') {
    o.x += o.vx;
    const top = Math.floor(o.y / TILE), bot = Math.floor((o.y + o.h - 0.001) / TILE);
    if (o.vx > 0) {
      const tx = Math.floor((o.x + o.w - 0.001) / TILE);
      for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)) { o.x = tx * TILE - o.w; o.vx = 0; return { tx, ty }; }
    } else if (o.vx < 0) {
      const tx = Math.floor(o.x / TILE);
      for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)) { o.x = (tx + 1) * TILE; o.vx = 0; return { tx, ty }; }
    }
  } else {
    o.y += o.vy;
    const left = Math.floor(o.x / TILE), right = Math.floor((o.x + o.w - 0.001) / TILE);
    if (o.vy > 0) {
      const ty = Math.floor((o.y + o.h - 0.001) / TILE);
      for (let tx = left; tx <= right; tx++) if (solid(tx, ty)) { o.y = ty * TILE - o.h; o.vy = 0; o.onGround = true; return { tx, ty }; }
    } else if (o.vy < 0) {
      const ty = Math.floor(o.y / TILE), cx = Math.floor((o.x + o.w / 2) / TILE);
      for (const tx of [cx, left, right]) if (solid(tx, ty)) { o.y = (ty + 1) * TILE; o.vy = 0; return { tx, ty }; }
    }
  }
  return null;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function bumpBlock(tx, ty) {
  if (tileAt(tx, ty) === T.GIFT) {
    setTile(tx, ty, T.USED);
    state.coins++; state.score += 200; totals.coins++;
    pops.push({ x: tx * TILE + TILE / 2, y: ty * TILE - 8, vy: -6, life: 30 });
    SFX.coin();
  } else SFX.bump();
  for (const e of level.enemies) if (e.alive && !e.fly && Math.abs(e.x + e.w / 2 - (tx * TILE + TILE / 2)) < TILE && Math.abs(e.y + e.h - ty * TILE) < 4) killEnemy(e);
}
function killEnemy(e) {
  e.alive = false; e.squash = 30;
  state.score += 100; totals.stomps++;
  burst(e.x + e.w / 2, e.y + e.h / 2, e.kind === 'bee' ? '#ffd23f' : '#9b6ad0', 10);
  SFX.stomp();
  if (totals.stomps >= 50) kit.unlock('stomp50');
}

// ================= Урон и смерть =================
function hurt() {
  if (state.phase !== 'play' || player.invuln > 0 || state.mode === 'demo') return;
  state.phase = 'dying';
  state.dyingT = 70;
  state.hurtInLevel = true;
  if (boss) state.bossHitTaken = true;
  player.vy = -9; player.vx = 0;
  if (kit.settings.shake) state.shake = 8;
  SFX.hurt();
}
function afterDeath() {
  state.lives--;
  if (state.lives <= 0) { levelFailed(); return; }
  // Уровень не перестраивается: собранные монеты и раздавленные жуки не возвращаются
  // (иначе монеты можно было бы собрать дважды). Босс, если был, ждёт нового входа в логово.
  boss = null; lockCam = null; rocks.length = 0;
  placePlayer(state.respawn.x);
  state.phase = 'play';
  kit.refreshMusic();
}

// ================= Шаг мира =================
function update() {
  state.frame++;
  if (state.shake > 0) state.shake *= 0.85;
  for (let i = particles.length - 1; i >= 0; i--) { const q = particles[i]; q.x += q.vx; q.y += q.vy; q.vy += 0.25; if (--q.life <= 0) particles.splice(i, 1); }
  if (state.phase === 'dying') {
    player.vy = Math.min(player.vy + GRAV, MAXFALL); player.y += player.vy;
    if (--state.dyingT <= 0) afterDeath();
    return;
  }
  if (state.phase === 'clear') { if (--state.clearT <= 0) levelComplete(); return; }
  if (state.phase !== 'play') return;
  state.timer++;
  if (player.invuln > 0) player.invuln--;

  // движущиеся платформы: сначала едут сами, потом везут стоящего
  for (const m of level.movers) {
    m.t++;
    const ox = m.x, oy = m.y;
    const off = Math.sin(m.t * 0.02 * m.speed) * m.range / 2 + m.range / 2;
    if (m.axis === 'x') m.x = m.bx + off; else m.y = m.by - off;
    m.dx = m.x - ox; m.dy = m.y - oy;
  }
  if (player.standOn) { player.x += player.standOn.dx; player.y += player.standOn.dy; }

  // управление
  let left, right, jumpDown, run;
  if (autopilot) ({ left, right, jumpDown, run } = pilot());
  else { left = kit.isDown('left'); right = kit.isDown('right'); jumpDown = kit.isDown('jump'); run = kit.isDown('run'); }
  const max = run ? RUN : WALK;
  if (left && !right) { player.vx = Math.max(player.vx - ACC, -max); player.facing = -1; }
  else if (right && !left) { player.vx = Math.min(player.vx + ACC, max); player.facing = 1; }
  else { player.vx *= FRICTION; if (Math.abs(player.vx) < 0.1) player.vx = 0; }
  // нажатие и отпускание между кадрами - тоже прыжок (короткий)
  if ((jumpDown && !jumpWasDown) || (!autopilot && kit.wasPressed('jump'))) player.buffer = JUMP_BUFFER;
  jumpWasDown = jumpDown;
  if (player.onGround) player.coyote = COYOTE; else if (player.coyote > 0) player.coyote--;
  if (player.buffer > 0) { player.buffer--; if (player.coyote > 0) { player.vy = JUMP_V; player.coyote = 0; player.buffer = 0; player.onGround = false; player.standOn = null; if (state.mode !== 'demo') SFX.jump(); } }
  // короткий прыжок, если кнопку отпустили; подброс пружины и отскок от босса не срезаются
  if (player.vy >= 0) player.boost = false;

  drawBackground();
  const x0 = Math.floor(camX / TILE), x1 = Math.min(level.w - 1, x0 + Math.ceil(W / TILE) + 1);
  for (let ty = 0; ty < ROWS; ty++) for (let tx = x0; tx <= x1; tx++) { const t = level.t[ty * level.w + tx]; if (t) drawTile(t, Math.floor(tx * TILE - camX), ty * TILE, tx, ty); }
  drawMisc();
  drawFlag();
  for (const c of level.coins) drawCoin(c);
  for (const e of level.enemies) drawEnemy(e);
  if (boss) drawBoss();
  for (const p of pops) rect(Math.floor(p.x - camX) - 5, p.y, 10, 14, '#ffd23f');
  drawHero();
  for (const q of particles) { ctx.globalAlpha = Math.max(0, q.life / 50); rect(q.x - camX, q.y, 3, 3, q.color); }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawHud();
}

kit = GameKit.create({
  id: 'jumper',

  actions: {

    run: { label: 'Бег', keys: ['ShiftLeft', 'KeyX'], pad: ['b2', 'b7'] },

  },
  music: MUSIC,
  difficultyNote: 'Лёгкая: 5 жизней на уровень, жуки медленнее, боссу хватит 2 ударов. Обычная: 3 жизни, 3 удара. Трудная: 2 жизни, жуки быстрее, 4 удара.',

    { id: 'world2', name: 'Герой подземелий', desc: 'Победить каменного голема и пройти игру' },
    { id: 'boss1', name: 'Корона упала', desc: 'Три раза прыгнуть на Короля жуков' },

  howto: `<p><b>Два мира по четыре уровня</b>: Солнечная долина и Подземелья. Четвёртый уровень мира - логово босса. Флажки посреди уровня - контрольные точки.</p>

    <p><b>Управление</b>: ← → или A/D - ходить, Shift или X - бежать, Пробел или ↑ - прыжок (держите - выше). Геймпад тоже работает.</p>
    <p>Прыгайте на жуков и пчёл сверху. Подарочный блок бейте снизу. Оранжевая пружина подбрасывает высоко. Шипы и ямы опасны. Короля жуков бейте прыжком по голове, голема - только когда он отдыхает и спрятал шипы.</p>`,
  credits: `<p><b>Прыг-скок</b> - фан-версия, не связана с правообладателем, часть «Игротеки».</p><p>Герой, жуки, пчёлы, блоки и боссы нарисованы кодом, музыка и звуки синтезируются WebAudio. Ни одного файла из интернета.</p>`,
  drawLogo(g, w, h, t) {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = 'bold 62px "Segoe UI", Arial, sans-serif';
    const y = h / 2 + 4 - Math.abs(Math.sin(t * 4)) * 8;
    g.lineWidth = 8; g.strokeStyle = '#1b1b2f'; g.strokeText('ПРЫГ-СКОК', w / 2, y);
    const grd = g.createLinearGradient(0, y - 30, 0, y + 30); grd.addColorStop(0, '#ffe27a'); grd.addColorStop(1, '#e8612c');
    g.fillStyle = grd; g.fillText('ПРЫГ-СКОК', w / 2, y);

  game: {
    menuItems() {
      const items = [];
      const next = Math.min(progress.unlocked, LEVELS.length - 1);
      if (progress.unlocked > 0 && !progress.done) items.push({ label: `Продолжить · уровень ${LEVELS[next].world}-${(next % 4) + 1}`, primary: true, id: 'continue', onClick: () => startLevel(next) });
      items.push({ label: progress.unlocked > 0 ? 'Играть с начала' : 'Играть', primary: !(progress.unlocked > 0 && !progress.done), id: 'play', onClick: () => startLevel(0) });
      items.push({ label: 'Карта уровней', id: 'levels', onClick: showLevelSelect });
      return items;
    },
    musicFor() { return boss ? 'boss' : (level && (level.theme === 'cave' || level.theme === 'fortress') ? 'cave' : 'game'); },
    onRestart() { startLevel(state.levelIdx); },
    onQuit() { startDemo(); },
    onResetProgress() { loadAll(); },
    recordsHtml() {
      const got = LEVELS.reduce((n, _, k) => n + (progress.levels[k] ? progress.levels[k].stars.filter(Boolean).length : 0), 0);
      return `<table><tr><td>Звёзды</td><td><b>${got} из ${LEVELS.length * 3}</b></td></tr>
        ${LEVELS.map((L, k) => { const r = progress.levels[k]; return `<tr><td>${L.world}-${(k % 4) + 1} ${L.name}</td><td>${r ? starsHtml(r.stars) + ' ' + fmtTime(r.best) : (k <= progress.unlocked ? 'не пройден' : '🔒')}</td></tr>`; }).join('')}
        <tr><td>Монет за все забеги / жуков</td><td>${totals.coins} / ${totals.stomps}</td></tr></table>`;
    },
  },
});

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP_MS) {
    if ((kit.mode === 'play' && state.mode === 'level') || (kit.mode === 'menu' && state.mode === 'demo')) update();
    kit.endStep();
    acc -= STEP_MS;
  }
  render();
  kit.countFrame();
  requestAnimationFrame(loop);
}
addEventListener('resize', fitCanvas);
loadAll();
fitCanvas();
startDemo();
kit.showMain();
requestAnimationFrame(loop);

  ready: true, T, TILE, W, H, LEVELS, JUMP_V, GRAV, WALK, RUN, SPRING_V,
  state, player, get kit() { return kit; }, get level() { return level; }, get boss() { return boss; }, rocks, THEMES, HUD_H, VIEW_H, get camX() { return camX; },
  get progress() { return progress; }, get totals() { return totals; }, get autopilot() { return autopilot; },
  step(n = 1, draw = true) { for (let i = 0; i < n; i++) { update(); kit.endStep(); } if (draw) render(); },
  setAutopilot(v) { autopilot = v; }, simulate,
  startLevel, startDemo, loadLevel, tileAt, setTile, hurt, starsFor, countGifts,
  addEnemy(px, py, kind = 'beetle') { const e = kind === 'bee' ? { kind, x: px, y: py, base: py, home: px, range: 64, w: 26, h: 20, vx: 0, vy: 0, fly: true, alive: true, squash: 0, active: true } : { kind, x: px, y: py, w: 28, h: 24, vx: -1, vy: 0, alive: true, squash: 0, active: true }; level.enemies.push(e); return e; },
  clearEnemies() { level.enemies.length = 0; },
  reseed(n) { rnd = mulberry32(n); },
  bannerCss() {
    if (!bannerRect) return null;
    const c = canvas.getBoundingClientRect(), k = c.width / W;
    return { left: c.left + bannerRect.x * k, top: c.top + bannerRect.y * k, right: c.left + (bannerRect.x + bannerRect.w) * k, bottom: c.top + (bannerRect.y + bannerRect.h) * k };
  },
};
